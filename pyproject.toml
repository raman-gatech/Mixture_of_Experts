[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "external-moe-router"
version = "0.1.0"
description = "DeBERTa routing with domain-specific Llama LoRA experts"
requires-python = ">=3.10"
dependencies = ["fastapi==0.115.12", "uvicorn==0.34.2"]

[project.optional-dependencies]
inference = ["torch==2.6.0", "transformers==4.57.5", "peft==0.18.1", "accelerate==1.12.0", "bitsandbytes==0.49.1", "sentencepiece==0.2.1", "protobuf>=4.25,<6"]
dev = ["pytest==8.3.5", "httpx==0.28.1"]
training = ["datasets==4.4.1"]
data = ["pyarrow==21.0.0"]
internal = ["torch==2.6.0", "numpy==2.2.6"]
native-api = ["httpx==0.28.1", "transformers==4.57.5"]
native-training = ["torch==2.6.0", "transformers==4.57.5", "peft==0.18.1", "accelerate==1.12.0", "datasets==4.4.1", "pyarrow==21.0.0"]
native-serving = ["vllm==0.11.0", "transformers==4.57.5", "huggingface-hub==0.36.0", "httpx==0.28.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
