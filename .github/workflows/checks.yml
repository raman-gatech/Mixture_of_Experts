name: Release checks
on: [push, pull_request]
jobs:
  cpu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-cpu-demo.lock
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q tests/test_api.py tests/test_cpu_demo.py tests/test_data.py tests/test_source_release.py
      - run: python -m compileall -q src scripts training evaluation
  model-logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev,internal,training,data]' transformers==4.57.5 peft==0.18.1 accelerate==1.12.0 sentencepiece==0.2.1 protobuf
      - run: python -m pytest -q --junitxml=pytest-model-logic.xml
        env:
          OMP_NUM_THREADS: '2'
          TOKENIZERS_PARALLELISM: 'false'
          HF_HUB_OFFLINE: '1'
      - name: Report model-logic failures
        if: failure()
        run: |
          python - <<'PYTEST_REPORT'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          path = Path('pytest-model-logic.xml')
          if path.exists():
              for case in ET.parse(path).iter('testcase'):
                  for kind in ('failure', 'error'):
                      node = case.find(kind)
                      if node is not None:
                          message = (case.get('name', '') + ': ' + (node.text or ''))[:3000]
                          message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                          print('::error title=Model logic test failure::' + message)
          PYTEST_REPORT
